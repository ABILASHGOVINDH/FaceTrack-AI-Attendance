<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        table {
            border: 2px solid black;
        }

        th, td {
            padding: 6px;
        }

        .Center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>

<form id="loginForm" action="/register/" method="GET" onsubmit="return validateLoginForm()">
    <table class="Center">
        <tr>
            <th colspan="2">
                <center><h3> FACE RECOGNITION ATTENDANCE LOGIN</h3><hr></center>
            </th>
        </tr>
        <tr>
            <th>Enter Your Id</th>
            <td><input type="text" id="enterYourId" name="enter_your_id"></td>
        </tr>
        <tr>
            <th>Name</th>
            <td><input type="text" id="name" name="name"></td>
        </tr>
        <tr>
            <th>Password</th>
            <td><input type="password" id="password" name="password"></td>
        </tr>
        <tr>
            <td colspan="2">
                <center><input type="submit" value="Submit"></center>
            </td>
        </tr>
    </table>
</form>

<script>
    function validateLoginForm() {
        var id = document.getElementById("enterYourId").value;
        var name = document.getElementById("name").value;
        var password = document.getElementById("password").value;

        if (id.trim() === "" || name.trim() === "" || password.trim() === "") {
            alert("Please fill in all fields.");
            return false; // Prevent form submission
        }
        
        return true; // Allow form submission
    }
</script>

</body>
</html>
